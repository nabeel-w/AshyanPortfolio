# Lighthouse CI (#20): runs on every successful Vercel deployment (preview and production),
# mobile emulation, and fails when the budgets in lighthouserc.json are missed.
# No secrets are used: reports end up in artifacts, so only publicly reachable deployments are audited.
# Previews behind Vercel Deployment Protection will fail to load; keep previews public or audit production only.
name: Lighthouse

on:
  deployment_status:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build URL list for this deployment
        id: urls
        env:
          BASE: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          base="${BASE%/}"
          {
            echo "list<<EOF"
            for path in / /work /about /contact /work/resonance; do echo "$base$path"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Lighthouse (mobile, 3 runs per page)
        uses: treosh/lighthouse-ci-action@512cc908a55bfb0ad231facca52adf3d3a651df4 # v12
        with:
          urls: ${{ steps.urls.outputs.list }}
          configPath: ./lighthouserc.json
          runs: 3
          uploadArtifacts: true
